<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>North.net — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-caixa">
    <h1 class="logo">North<span class="logo-net">.net</span></h1>
    <p class="login-sub" id="loginSub">Crie sua conta para começar</p>

    <input type="text" id="inputUsuario" placeholder="Usuário">
    <input type="password" id="inputSenha" placeholder="Senha">

    <button id="btnAcao">Criar conta</button>
    <p class="login-erro" id="loginErro"></p>
  </div>

  <script src="login.js"></script>
</body>
</html>
