<!DOCTYPE html>
<html lang="pt-BR" class="north-auth-aguardando">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>North.net</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>html.north-auth-aguardando body { visibility: hidden; }</style>
</head>
<body>
  <div class="fundo-decoracao">
    <span class="deco d1">💿</span><span class="deco d2">✨</span>
    <span class="deco d3">📼</span><span class="deco d4">☎️</span>
    <span class="deco d5">💌</span><span class="deco d6">⭐</span>
    <span class="deco d7">🎀</span><span class="deco d8">📀</span>
    <span class="deco d9">💾</span><span class="deco d10">🌸</span>
  </div>
  <div class="laptop">
    <div class="laptop-tela">
      <div class="laptop-marca">North.net</div>
      <div class="pagina">
        <div class="player">
          <div class="player-topo">
            <span class="dot dot-vermelho"></span>
            <span class="dot dot-amarelo"></span>
            <span class="dot dot-verde"></span>
          </div>
          <div class="player-corpo">
            <div class="player-tela player-tela-padrao" id="capaTela">
              <div class="player-marca">North.net</div>
              <div class="player-capa-botoes">
                <button class="player-editar-capa" id="btnEditarCapa" type="button">🖌 Trocar capa</button>
                <button class="player-remover-capa" id="btnRemoverCapa" type="button" aria-label="Remover capa">🗑</button>
              </div>
              <input type="file" id="inputCapa" accept="image/*" hidden>
            </div>
            <div class="player-lista">
              <a href="../feed-social/index.html" class="clipe">
                <div class="clipe-preview">📸</div><span class="clipe-nome">Feed</span>
              </a>
              <span class="clipe clipe-desativado">
                <div class="clipe-preview">📚</div><span class="clipe-nome">Estante</span>
              </span>
            </div>
          </div>
          <div class="player-rodape">
            <button id="btnSair" class="botao-sair" type="button">Sair da conta</button>
          </div>
        </div>
      </div>
    </div>
    <div class="laptop-base"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../north-auth.js"></script>
  <script>northAuth.carregarProtegida("script.js");</script>
</body>
</html>
